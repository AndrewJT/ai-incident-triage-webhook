[project]
name = "ai-incident-triage-webhook"
version = "1.0.0"
description = "Webhook-triggered AI incident triage: RAG over runbooks + local Ollama LLM with schema-enforced output"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
